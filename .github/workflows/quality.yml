name: Code Quality & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring
        coverage: pcov
        tools: composer:v2, mago

    - name: Validate composer.json
      run: composer validate --strict

    - name: Drop local path repositories
      run: >-
        php -r '$c = json_decode(file_get_contents("composer.json"), true);
        $c["repositories"] = array_values(array_filter($c["repositories"], fn ($r) => $r["type"] !== "path"));
        file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");'

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php-version }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Check formatting and lint (Mago)
      run: composer cs-check

    - name: Static analysis (Mago)
      if: success() || failure()
      run: composer analyze

    - name: Run unit tests
      run: composer test:unit

    - name: Run integration tests
      run: composer test:integration

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring
        coverage: none
        tools: composer:v2

    - name: Drop local path repositories
      run: >-
        php -r '$c = json_decode(file_get_contents("composer.json"), true);
        $c["repositories"] = array_values(array_filter($c["repositories"], fn ($r) => $r["type"] !== "path"));
        file_put_contents("composer.json", json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Security audit
      run: composer audit --abandoned=report
